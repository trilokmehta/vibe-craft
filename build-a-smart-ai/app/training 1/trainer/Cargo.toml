[package]
name = "trainer"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis", "pcm"] }

image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3

[package]
name = "vibe-craft"
version = "0.3.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", default-features = false }
cpal = "0.15"
rfd = "0.14"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis", "pcm"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
ort = "=2.0.0-rc.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automix"
version = "0.1.0"
description = "Open-source DJ-style automatic song transitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pyrubberband>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
automix = "automix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
